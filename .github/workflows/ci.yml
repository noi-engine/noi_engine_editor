name: ci

# Builds the editor on every push and pull request, so a broken build is caught before a release.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: ''
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libgl1-mesa-dev libxkbcommon-dev

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'fd3dde77905b1b1890df3c8daa496d9b2fe44f7f'

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release
          buildPreset: release
